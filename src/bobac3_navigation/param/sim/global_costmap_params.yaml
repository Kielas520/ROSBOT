global_costmap:
  global_frame: map                            # 全局坐标系，基于 SLAM 或静态地图
  robot_base_frame: base_footprint             # 机器人基坐标系，通常为底盘中心
  update_frequency: 1.0                       # 成本地图更新频率（Hz），禁用自动更新以固定第一帧
  publish_frequency: 1.0                      # 成本地图发布频率（Hz），便于调试
  transform_tolerance: 0.3                    # 坐标变换时间容差（秒），适应导航需求
  track_unknown_space: true                   # 启用未知空间跟踪，允许规划通过未知区域
  static_map: true                            # 使用静态地图（如 SLAM 生成）
  rolling_window: false                       # 禁用滚动窗口，确保全局地图固定

  inflation_layer:
    enabled: true                             # 启用膨胀层，为障碍物添加安全距离
    cost_scaling_factor: 1.0                  # 膨胀成本衰减因子，低值平滑成本分布
    inflation_radius: 0.3                    # 障碍物膨胀半径（米），减小以最小化目标点影响

  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}  # 静态地图层
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}  # 膨胀层

  recovery_behaviors:
    - name: 'rotate_recovery'
      type: 'rotate_recovery/RotateRecovery'  # 旋转恢复，尝试调整朝向
    - name: 'reset_recovery'
      type: 'clear_costmap_recovery/ClearCostmapRecovery'  # 清除成本地图

  reset_recovery:
    reset_distance: 0.0                       # 清除整个成本地图
    layer_names: ["static_layer"]  # 确保恢复初始状态
