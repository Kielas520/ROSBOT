GlobalPlanner:                                  # 全局规划器配置
  old_navfn_behavior: true                     # 是否使用旧的 navfn 行为，完全模仿 navfn 的行为，默认 false
  use_quadratic: true                           # 是否使用势场的二次方近似计算，生成平滑路径，默认 true
  use_dijkstra: true                            # 是否使用 Dijkstra 算法，适合复杂环境，默认 true
  use_grid_path: true                           # 是否生成沿网格边界的路径，帮助绕过小范围噪点，默认 false
  
  allow_unknown: true                           # 允许规划器通过未知空间，增加灵活性，默认 true
                                                # 需要在障碍物/体视层设置 track_unknown_space: true 才能生效
  planner_window_x: 0.0                         # 规划器在 x 方向的窗口大小，0.0 表示全局规划，默认 0.0
  planner_window_y: 0.0                         # 规划器在 y 方向的窗口大小，0.0 表示全局规划，默认 0.0
