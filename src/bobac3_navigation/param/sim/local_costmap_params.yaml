# 局部代价地图的全局配置
local_costmap:
  # 坐标系设置
  global_frame: odom                  # 全局参考坐标系
  robot_base_frame: base_footprint    # 机器人基座坐标系
  transform_tolerance: 0.5            # TF 变换的容忍时间（秒）

  # 地图更新和发布频率
  update_frequency: 15.0               # 地图更新频率（Hz）
  publish_frequency: 10.0              # 地图发布频率（Hz）

  # 地图类型和尺寸
  rolling_window: true                # 启用滚动窗口，地图以机器人为中心
  width: 2.0                         # 地图宽度（米）
  height: 2.0                        # 地图高度（米）
  resolution: 0.05                   # 地图分辨率（米/格）

  # 机器人几何参数
  robot_radius: 0.1                 # 圆形机器人半径（米）
  # footprint: [[x0, y0], [x1, y1], ... [xn, yn]]  # 如果机器人非圆形，取消注释并设置足迹

  # 使用的插件
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}  # 障碍物层
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}  # 膨胀层

  # 障碍物层配置
  obstacle_layer:
    enabled: true                    # 启用障碍物层
    max_obstacle_height: 1.0         # 最大障碍物高度（米）
    obstacle_range: 2.0              # 检测障碍物的最大距离（米）
    raytrace_range: 3.0              # 清除空闲区域的最大距离（米）
    track_unknown_space: false       # 不跟踪未知空间（仅用于全局规划）
    footprint_clearing_enabled: false # 是否根据机器人足迹清除障碍物
    combination_method: 1            # 代价组合方法（1 表示最大值）

    # 传感器数据源
    observation_sources: scan        # 数据源名称
    scan:
      data_type: LaserScan          # 数据类型为 LaserScan
      topic: scan_filtered          # 雷达数据话题
      marking: true                 # 使用数据标记障碍物
      clearing: true                # 使用数据清除空闲区域
      min_obstacle_height: 0.05     # 最小障碍物高度（米）
      max_obstacle_height: 0.5      # 最大障碍物高度（米）
      obstacle_range: 2.0           # 障碍物检测范围（米）
      raytrace_range: 3.0           # 清除范围（米）
      inf_is_valid: false           # 是否将无穷大值视为有效
      observation_persistence: 0.0  # 数据持久时间（0 表示不保留旧数据）
      expected_update_rate: 0.0     # 预期更新率（0 表示不强制检查）

  # 膨胀层配置
  inflation_layer:
    enabled: true                    # 启用膨胀层
    cost_scaling_factor: 3.5         # 代价衰减因子，控制膨胀区域代价下降速度
    inflation_radius: 0.23            # 膨胀半径（米），障碍物周围的安全距离
    
